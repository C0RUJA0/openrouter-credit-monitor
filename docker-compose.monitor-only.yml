# Monitor-only deployment (no bundled Evolution). Use this when you already have
# an Evolution API elsewhere, or to run the monitor behind the Central proxy.
# The default docker-compose.yml is the all-in-one (monitor + Evolution).

services:
  openrouter-credit-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openrouter-credit-monitor
    restart: unless-stopped
    env_file:
      - backend/.env
      - frontend/.env
    volumes:
      - monitor-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  monitor-data:

# If the Central/reverse proxy runs in its own compose project, attach this
# service to that shared external network instead of the default one, e.g.:
# networks:
#   default:
#     name: central-net
#     external: true
