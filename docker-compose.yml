# ALL-IN-ONE deployment (default). A single `docker compose up` brings up the
# monitor PLUS a bundled Evolution API (with its own Postgres + Redis), already
# wired together. The monitor auto-connects to Evolution over the internal
# network and shows the WhatsApp pairing QR in its own UI — no separate Evolution
# deploy, no manual URL/key configuration.
#
# Zero-config for local/LAN: boots with sensible defaults and no .env needed.
# For PRODUCTION, override via environment / Coolify secrets (at minimum:
# APP_ENV=production, ADMIN_PASSWORD_HASH, SESSION_SECRET, a strong
# EVOLUTION_API_KEY and POSTGRES_PASSWORD, and OPENROUTER_MANAGEMENT_KEY).
#
# Monitor-only (no bundled Evolution): use docker-compose.monitor-only.yml.

services:
  openrouter-credit-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: openrouter-credit-monitor
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8080"
      ROOT_PATH: ${ROOT_PATH:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LAN_ONLY: ${LAN_ONLY:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      # Evolution is auto-wired to the bundled service below.
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-local-dev-evolution-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-openrouter-monitor}
      WHATSAPP_DESTINATION: ${WHATSAPP_DESTINATION:-}
      DATABASE_URL: sqlite:////app/data/monitor.db
    volumes:
      - monitor-data:/app/data
    expose:
      - "8080"
    depends_on:
      - evolution-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-local-dev-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:-evolution_local_dev}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution-instances:/evolution/instances
    expose:
      - "8080"
    # Optional: expose the Evolution manager on the LAN for debugging. The
    # monitor does not need this — it reaches Evolution internally.
    # ports:
    #   - "8088:8080"
    depends_on:
      - evolution-postgres
      - evolution-redis

  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolution_local_dev}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-redis:/data

volumes:
  monitor-data:
  evolution-instances:
  evolution-postgres:
  evolution-redis:
